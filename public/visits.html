<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Visits — MediCloud</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">M</div>
        <div class="brand-info">
          <h1>
            MediCloud
            <span class="brand-glow-pill">
              <span class="glow-dot"></span>
              Live
            </span>
          </h1>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a href="records.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Medical Records
        </a>
        <a href="visits.html" class="nav-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Doctor Visits
        </a>
        <a href="prescriptions.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
          Prescriptions
        </a>
        <a href="documents.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
          Health Documents
        </a>
        <a href="profile.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Health Profile
        </a>
      </nav>
      <div class="sidebar-footer">
        <span class="cloud-badge">Cloud-Ready API</span>
        <span>v1.0.0</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle Navigation">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div class="search-box-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="global-search-input" class="search-input" placeholder="Search records, doctors, medicine, docs..." autocomplete="off">
          <div id="search-results-dropdown" class="search-results-dropdown"></div>
        </div>

        <div class="top-bar-actions">
          <button class="btn btn-secondary btn-sm" onclick="exportHealthReportPDF()" title="Export complete health records as PDF">
            📄 Export PDF Report
          </button>
          <button class="btn btn-secondary btn-sm" onclick="toggleTheme()" title="Toggle Dark/Light Mode" style="padding: 7px 10px;">
            🌓
          </button>
          <a href="profile.html" class="user-mini-card">
            <div class="user-avatar">--</div>
            <span class="user-name">Loading...</span>
          </a>
        </div>
      </header>

      <section class="page-body">
        <div class="page-header">
          <div class="page-title-group">
            <h2>Doctor Visits</h2>
            <p>Track clinician appointments, hospital consultations, and upcoming follow-ups.</p>
          </div>
          <button class="btn btn-primary" onclick="openAddVisitModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Log Visit
          </button>
        </div>

        <!-- Filter Toolbar -->
        <div class="filter-bar">
          <div class="filter-group">
            <input type="text" id="search-input" class="form-control" placeholder="Search visits..." style="width: 180px;">

            <select id="filter-specialization" class="form-control">
              <option value="All">All Specializations</option>
              <option value="Internal Medicine">Internal Medicine</option>
              <option value="Pulmonology">Pulmonology</option>
              <option value="Dermatology">Dermatology</option>
              <option value="Ophthalmology">Ophthalmology</option>
              <option value="Cardiology">Cardiology</option>
              <option value="Orthopedics">Orthopedics</option>
            </select>

            <input type="text" id="filter-doctor" class="form-control" placeholder="Filter by Doctor..." style="width: 160px;">

            <select id="filter-sort" class="form-control">
              <option value="newest">Sort: Newest First</option>
              <option value="oldest">Sort: Oldest First</option>
              <option value="alphabetical">Sort: Doctor (A-Z)</option>
            </select>
          </div>

          <div>
            <button class="btn btn-secondary btn-sm" onclick="resetVisitFilters()">Reset Filters</button>
          </div>
        </div>

        <!-- Visits Grid -->
        <div id="visits-container" class="cards-grid">
          <p style="color: var(--text-muted);">Loading doctor visits...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Add/Edit Visit Modal -->
  <div id="visit-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="visit-modal-title">Log Doctor Visit</h3>
        <button class="modal-close" onclick="closeModal('visit-modal')">&times;</button>
      </div>
      <form id="visit-form">
        <div class="modal-body">
          <input type="hidden" id="visit-id">

          <div class="form-row">
            <div class="form-group">
              <label for="visit-doctor">Doctor Name *</label>
              <input type="text" id="visit-doctor" class="form-control" placeholder="e.g. Dr. Arvind Mehta" required>
            </div>
            <div class="form-group">
              <label for="visit-specialization">Specialization *</label>
              <input type="text" id="visit-specialization" class="form-control" placeholder="e.g. Internal Medicine" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="visit-hospital">Hospital / Clinic *</label>
              <input type="text" id="visit-hospital" class="form-control" placeholder="e.g. Apex Multispeciality Hospital" required>
            </div>
            <div class="form-group">
              <label for="visit-date">Visit Date *</label>
              <input type="date" id="visit-date" class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label for="visit-reason">Reason for Visit *</label>
            <input type="text" id="visit-reason" class="form-control" placeholder="e.g. Annual full body physical" required>
          </div>

          <div class="form-group">
            <label for="visit-followup">Follow-up Date (Optional)</label>
            <input type="date" id="visit-followup" class="form-control">
          </div>

          <div class="form-group">
            <label for="visit-notes">Doctor Observations / Notes</label>
            <textarea id="visit-notes" class="form-control" rows="3" placeholder="Blood pressure, vitals, next steps..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('visit-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Visit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/visits.js"></script>
</body>
</html>
